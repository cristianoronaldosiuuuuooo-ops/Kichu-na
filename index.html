<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<link rel="manifest" href="manifest.json">
<title>ツ অপূর্ণ ইচ্ছে ツ | Post Maker</title>
<style>
@font-face{font-family:NotoBengali;src:url('assets/fonts/NotoSerifBengali-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:NotoBengali;src:url('assets/fonts/NotoSerifBengali-Bold.ttf') format('truetype');font-weight:800}
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:900px;margin:auto;padding:18px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#a9abb2;font-size:13px;margin-bottom:16px}
.panel{background:#191a1e;border:1px solid #2b2d33;border-radius:18px;padding:14px}
textarea{width:100%;min-height:145px;resize:vertical;background:#101114;color:#fff;border:1px solid #34363d;border-radius:13px;padding:14px;font:400 18px/1.65 NotoBengali,serif;outline:none}
textarea:focus{border-color:#777}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:12px;padding:13px 12px;font-weight:700;font-size:14px;cursor:pointer}
#save{background:#f2f2f2;color:#111}
#clear{background:#2b2d33;color:#eee}
.preview-wrap{margin-top:16px;background:#0b0c0e;border-radius:18px;padding:10px}
canvas{display:block;width:100%;height:auto;border-radius:12px}
.tip{font-size:12px;color:#9ea1aa;line-height:1.55;margin:10px 2px 0}
.file{margin-top:10px;font-size:13px}
.file input{width:100%;margin-top:7px}
</style>
</head>
<body>
<div class="app">
  <h1>ツ অপূর্ণ ইচ্ছে ツ · Post Maker</h1>
  <div class="sub">Text paste করলেই background-এর ওপর automatic design হবে।</div>

  <div class="panel">
    <textarea id="text" placeholder="এখানে তোমার ছোট লেখা paste করো...">বৃষ্টির দিনে কিছু গল্প
শব্দ ছাড়াই মনে থেকে যায়।</textarea>
    <div class="controls">
      <button id="save">JPG হিসেবে Save</button>
      <button id="clear">Text Clear</button>
    </div>
    <div class="file">
      <label>অন্য background ব্যবহার করতে চাইলে:</label>
      <input id="bg" type="file" accept="image/*">
    </div>
  </div>

  <div class="preview-wrap">
    <canvas id="canvas" width="1080" height="1350"></canvas>
    <div class="tip">Tip: খুব বড় লেখা দিলে font নিজে ছোট হবে। 1–6 লাইনের short quote-এর জন্য design করা।</div>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const ta=document.getElementById('text'), bgInput=document.getElementById('bg');
let bgImg=new Image(), custom=false;

bgImg.src='assets/background.png';
bgImg.onload=draw;

function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function fitImage(img,w,h){
  const scale=Math.max(w/img.width,h/img.height);
  const iw=img.width*scale, ih=img.height*scale;
  return {x:(w-iw)/2,y:(h-ih)/2,w:iw,h:ih};
}

function wrapLines(text,maxWidth,font){
  ctx.font=font;
  const out=[];
  for(const paragraph of text.split(/\n/)){
    if(!paragraph.trim()){out.push('');continue}
    let line='';
    for(const ch of paragraph){
      const test=line+ch;
      if(ctx.measureText(test).width>maxWidth && line){out.push(line);line=ch}
      else line=test;
    }
    if(line)out.push(line);
  }
  return out;
}

function draw(){
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const p=fitImage(bgImg,W,H);
  ctx.drawImage(bgImg,p.x,p.y,p.w,p.h);

  // Cinematic darkening, strongest where text sits.
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(0,0,0,.38)');
  g.addColorStop(.35,'rgba(0,0,0,.18)');
  g.addColorStop(.62,'rgba(0,0,0,.30)');
  g.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Subtle vignette.
  const v=ctx.createRadialGradient(W/2,H*.45,H*.15,W/2,H*.45,H*.78);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,.34)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);

  const text=ta.value.trim();
  let size=72;
  if(text.length>70) size=60;
  if(text.length>110) size=50;
  if(text.length>160) size=42;
  const font=`800 ${size}px NotoBengali, serif`;
  const lines=wrapLines(text||'এখানে লেখা দেখা যাবে',W*.78,font);
  const lineH=size*1.55;
  const blockH=lines.length*lineH;
  let y=H*.40-blockH/2+size*.85;

  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.font=font;
  ctx.shadowColor='rgba(0,0,0,.82)';
  ctx.shadowBlur=18;
  ctx.shadowOffsetY=5;
  ctx.fillStyle='#fff';

  for(const line of lines){
    if(line===''){y+=lineH*.55;continue}
    ctx.fillText(line,W/2,y);
    y+=lineH;
  }
  ctx.shadowColor='transparent';

  // Divider + page name branding at bottom.
  ctx.strokeStyle='rgba(255,255,255,.55)';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2-48,H-128);ctx.lineTo(W/2+48,H-128);ctx.stroke();

  ctx.font='800 30px NotoBengali, serif';
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.fillText('ツ অপূর্ণ ইচ্ছে ツ',W/2,H-78);
}

ta.addEventListener('input',draw);

bgInput.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>{bgImg=im;custom=true;draw();URL.revokeObjectURL(url)}
  im.src=url;
});

document.getElementById('clear').onclick=()=>{
  ta.value='';
  draw();
  ta.focus();
};

document.getElementById('save').onclick=()=>{
  draw();
  const a=document.createElement('a');
  a.download='opurno-icche-post.jpg';
  a.href=canvas.toDataURL('image/jpeg',.94);
  a.click();
};

// PWA service worker registration when served from a web host.
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
